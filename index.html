<!DOCTYPE html>
<html lang="da">
  
<head>
  <meta charset="UTF-8" />
  
<!-- Responsive design for mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulse Athletics - PULSE Core</title>

<!-- Link to stylesheet -->
  <link rel="stylesheet" href="stylesheet.css" />

<!-- Added fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Merriweather&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    rel="stylesheet"
  />
</head>


<body>
<!-- Page header with navigation -->
  <header>
    <nav>
<!-- Left pill navigation -->
      <a href="#" class="nav-pill nav-left">Products</a>
<!-- Center navigation logo -->
      <a href="#" class="nav-pill nav-center">
        <img src="images/Artboard1.svg" alt="Pulse Athletics Logo" class="nav-logo" />
      </a>
<!-- Right pill navigation with cart icon -->
      <a href="#" class="nav-pill nav-right">
        Cart <i class="fa fa-shopping-cart"></i>
      </a>
    </nav>
  </header>


  <main>
<!-- Central panel with product info -->
    <section class="panel">
<!-- Left side: product images -->
      <figure class="image-section">
        <img src="images/watch.png" alt="PULSE Core Watch" class="watch" />
        <img src="images/phone.png" alt="PULSE App Phone" class="phone" />
      </figure>
<!-- Right side: headline, description, features, and CTAs -->
      <article class="content-section">
        <h1>MAKE EVERY WORKOUT COUNT.</h1>
        <p>PULSE Core tracks your performance, recovery and everyday activity.</p>
        <ul>
          <li>Track workout</li>
          <li>Heart rate monitor</li>
          <li>Track REM-sleep</li>
          <li>Analyze tendencies</li>
          <li>Achieve goals</li>
        </ul>
        <nav class="buttons">
          <button class="btn-primary">Buy Now</button>
          <button class="btn-secondary">More Specs & Features</button>
        </nav>
      </article>
    </section>
  </main>
</body>
</html>
